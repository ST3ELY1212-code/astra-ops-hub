<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/><title>Astra Ops Hub</title>
<style>body{font-family:system-ui;margin:0;background:#f6f3ee;color:#0f1419}header,main{max-width:980px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}article{background:#fff;border:1px solid #d7dde3;border-radius:12px;padding:14px}code{font-size:12px;color:#5b6570}</style></head>
<body><header><h1>Astra Ops Hub</h1><p>19 engines. Evidence vs assumption. Writes gated. MCP memory.</p>
<p><a href="https://github.com/ST3ELY1212-code/astra-ops-hub">github.com/ST3ELY1212-code/astra-ops-hub</a></p>
<pre>python -m astra_ops.cli run support_resolver
python -m astra_ops.cli monitor</pre></header><main class="grid" id="c"></main>
<script>const cases=[["computer_agent","Onboard across HR/CRM/portal"],["coding_agent","Logout bug patch + test"],["website_qa","Exploratory checkout"],["support_resolver","Missing-order pack"],["sales_crm","Lead score, no send"],["competitive_intel","Five-competitor matrix"],["financial_analyst","QoQ + IC memo"],["spreadsheet_intel","Anomalies + stockout"],["document_deck","Template slides"],["research_agent","Verified vs assumption"],["legal_review","First-pass exceptions"],["ecommerce_ops","Pay vs stock vs carrier"],["startup_os","Weekly asks"],["data_science","Stats + next test"],["engineering_cad","OpenSCAD + inspect"],["it_ops","Diagnose, gate restart"],["marketing_ops","Stop spend on stockouts"],["healthcare_admin","Admin only"],["multi_agent","Route specialists"]];
document.getElementById("c").innerHTML=cases.map(([id,w])=>`<article><h3>${id}</h3><p>${w}</p><code>python -m astra_ops.cli run ${id}</code></article>`).join("")</script></body></html>
